<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混毛払出指図</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --line:#cfd6dd; --ink:#1f2933;
    --sub:#66727f; --accent:#1565c0; --accent-weak:#e3f0ff;
    --ok:#2e7d32; --ok-weak:#e6f4ea; --warn:#b26a00; --empty:#eef1f4;
    --chip:#eef2f6; --hdr:#eaf0f6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 14px;}
  .title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  h1{font-size:18px;margin:0;}
  .meta{color:var(--sub);font-size:12px;}
  main{padding:12px;max-width:1000px;margin:0 auto;}

  /* 検索 */
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:12px;}
  .search-box{display:flex;gap:8px;}
  .search-box input{flex:1;padding:12px 12px;border:1px solid var(--line);
    border-radius:10px;font-size:16px;}
  .search-box button{padding:0 14px;border:1px solid var(--line);background:var(--chip);
    border-radius:10px;cursor:pointer;font-size:14px;}
  .hint{color:var(--sub);font-size:12px;margin-top:8px;}
  .count{color:var(--sub);font-size:13px;margin:4px 2px 10px;}

  /* 糸順号の一覧（検索結果・カード） */
  .jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .jcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;cursor:pointer;}
  .jcard:active{background:var(--accent-weak);}
  .jcard .jno{font-weight:800;color:var(--accent);font-size:17px;letter-spacing:.5px;}
  .jcard .jsub{font-size:12px;color:var(--sub);margin-top:3px;}
  .jcard .jqc{font-size:14px;margin-top:4px;font-weight:600;}
  .jcard.norecipe{opacity:.55;}
  .list-empty{color:var(--sub);text-align:center;padding:24px;}

  /* 払出票ビュー */
  #view-ticket{display:none;}
  .back-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .back-bar button{padding:9px 14px;border:1px solid var(--line);background:var(--panel);
    border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;}
  .back-bar .pager{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--sub);font-size:13px;}
  .back-bar .pager button{padding:7px 12px;}

  /* === 払出票：PDF原本どおりの書式（白地・黒罫線・格子） === */
  .ticket{background:#fff;color:#000;border-radius:0;overflow:hidden;}
  .t-sheet{max-width:860px;margin:0 auto;}

  /* 上段：タイトル中央＋右上に台号/氏名の小表 */
  .t-top{position:relative;padding:6px 0 10px;}
  .t-title{text-align:center;font-size:30px;font-weight:800;letter-spacing:6px;line-height:1.1;}
  .t-date{text-align:center;font-size:13px;color:#000;margin-top:4px;}
  .t-daihyo{position:absolute;top:4px;right:0;border-collapse:collapse;}
  .t-daihyo td{border:1px solid #000;font-size:13px;text-align:center;}
  .t-daihyo td.lab{font-weight:700;padding:3px 18px;}
  .t-daihyo td.blank{height:34px;}

  /* ヘッダ表（糸順号／糸品質・糸色番・トップ量） */
  table.t-head2{border-collapse:collapse;width:100%;table-layout:fixed;}
  table.t-head2 td{border:1px solid #000;padding:7px 8px;font-size:16px;height:34px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  table.t-head2 td.k{font-weight:700;text-align:center;background:#fff;}
  table.t-head2 td.v{font-weight:800;text-align:center;}

  /* 明細表（PDFと同じ8列の格子） */
  .detail-table-wrap{overflow-x:auto;}
  table.det{border-collapse:collapse;width:100%;font-size:15px;table-layout:fixed;}
  table.det th,table.det td{border:1px solid #000;padding:5px 6px;text-align:center;
    white-space:nowrap;height:32px;overflow:hidden;text-overflow:ellipsis;}
  table.det th{font-weight:700;background:#fff;}
  table.det td,table.det th{color:#000;}
  table.det col.c-hinshitsu{width:10%;} table.det col.c-iro{width:11%;}
  table.det col.c-hitsuyo{width:9%;} table.det col.c-basho{width:9%;}
  table.det col.c-some{width:15%;} table.det col.c-label{width:7%;}
  table.det col.c-zaiko{width:11%;} table.det col.c-tekisho{width:18%;}

  /* スマホ用：構成ごとのカード */
  .det-cards{display:none;}
  .dc{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .dc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 12px;background:var(--hdr);}
  .dc-qc{font-weight:800;font-size:16px;}
  .dc-qc .q{color:var(--ink);} .dc-qc .c{color:var(--accent);margin-left:6px;}
  .dc-need{font-size:13px;color:var(--sub);text-align:right;}
  .dc-need b{font-size:19px;color:var(--accent);}
  .dc-stocks{padding:6px 12px 10px;}
  .st{display:flex;flex-wrap:wrap;gap:3px 12px;padding:8px 0;border-bottom:1px dashed var(--line);
    font-size:14px;align-items:baseline;}
  .st:last-child{border-bottom:none;}
  .st .place{font-weight:800;color:var(--accent);min-width:46px;}
  .st .dye{font-weight:700;}
  .st .kv{color:var(--sub);font-size:12px;}
  .st .kv b{color:var(--ink);font-size:14px;font-weight:700;}
  .st.z{opacity:.5;}
  .nostock-msg{color:var(--warn);font-size:13px;padding:8px 0;}

  /* スマホでもPDF原本どおりの表を表示（カードは使わない）。
     横スクロールを避けるため、8列を画面幅に収めるようフォント・余白・列幅を詰める。 */
  @media (max-width:640px){
    .det-cards{display:none;}            /* カードは廃止（様式をPCと統一） */
    table.det{display:table;}            /* スマホでも表を表示 */
    table.det{min-width:0;width:100%;table-layout:fixed;font-size:11px;}
    .detail-table-wrap{overflow-x:hidden;}   /* 横スクロールさせない */
    /* セルは各列の幅内に収め、はみ出しは隠す（隣と重ならないように）。 */
    table.det th,table.det td{padding:3px 1px;height:auto;line-height:1.2;
      white-space:nowrap;overflow:hidden;text-overflow:clip;}
    /* ヘッダ(見出し)は文字数が多い列があるので、ヘッダだけ折り返して2段で収める。
       本文の値は短いので折り返さず1行。 */
    table.det thead th{white-space:normal;word-break:keep-all;line-height:1.1;
      padding:3px 0;}
    /* 染順号・染順号手記入は長い値なので本文も折り返し許可。 */
    table.det td.wrap{white-space:normal;word-break:break-all;}
    /* 列幅を画面幅内に再配分（合計100%）。ラベルは値が1〜2桁なので狭くてよいが、
       見出し「ラベル」が切れないよう最小限確保。品質・色番は広め。 */
    table.det col.c-hinshitsu{width:12%;} table.det col.c-iro{width:14%;}
    table.det col.c-hitsuyo{width:9%;}    table.det col.c-basho{width:8%;}
    table.det col.c-some{width:16%;}      table.det col.c-label{width:8%;}
    table.det col.c-zaiko{width:11%;}     table.det col.c-tekisho{width:22%;}
    .t-title{font-size:24px;letter-spacing:3px;}
    .t-daihyo{position:static;margin:8px 0 0 auto;}
    /* ヘッダ表：糸色番などは1行で（折り返さない）。長い値は縮小して収める。 */
    table.t-head2{table-layout:auto;}
    table.t-head2 td{font-size:13px;padding:5px 4px;
      white-space:nowrap;overflow:hidden;text-overflow:clip;}
    table.t-head2 td.k{width:1%;padding:5px 6px;}   /* ラベル列は内容ぶんだけ */
    table.t-head2 td.v{font-size:13px;}
  }

  /* 印刷：PDFと同じ表だけを出す（検索UIは隠す） */
  @media print{
    body{background:#fff;}
    header,.back-bar,.det-cards{display:none !important;}
    main{padding:0;max-width:none;}
    .ticket{border:none;}
    table.det{display:table !important;min-width:0;}
    .t-daihyo{position:absolute;}
    #srcFoot{display:none !important;}
  }

  /* 元データ欄（画面の一番下。印刷では出さない） */
  #srcFoot{max-width:1000px;margin:18px auto 24px;padding:0 12px;font-size:12px;color:var(--sub);}
  #srcFoot h2{font-size:13px;margin:0 0 6px;color:var(--ink);}
  #srcFoot .src-wrap{overflow-x:auto;}
  #srcFoot table{border-collapse:collapse;width:100%;background:var(--panel);}
  #srcFoot th,#srcFoot td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;}
  #srcFoot th{background:var(--hdr);color:var(--ink);white-space:nowrap;}
  #srcFoot td.num{text-align:right;white-space:nowrap;}
  #srcFoot td.bad{color:#c62828;font-weight:700;}
  #srcFoot .src-note{margin-top:6px;line-height:1.6;}
  #srcFoot details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;}
  #srcFoot summary{cursor:pointer;font-size:13px;color:var(--ink);font-weight:700;}
  #srcFoot summary:focus-visible{outline:2px solid #1a73e8;outline-offset:2px;}
  #srcFoot summary .sum-info{font-weight:400;color:var(--sub);margin-left:10px;}
  #srcFoot summary .sum-warn{font-weight:700;color:#c62828;margin-left:10px;}
  #srcFoot details[open] summary{margin-bottom:6px;}
  #srcFoot .cy{display:inline-block;padding:1px 8px;border-radius:10px;font-weight:700;white-space:nowrap;}
  #srcFoot .cy-r{background:#e3f2fd;color:#0d47a1;}
  #srcFoot .cy-s{background:#eee;color:#555;}
</style>
<script>
/* 画面の自動リロード（5分ごと）。http/httpsのときだけ。GitHub Pagesのキャッシュ対策に時刻クエリ付与。 */
(function(){
  var MINUTES = 5;
  if(location.protocol === "http:" || location.protocol === "https:"){
    setTimeout(function(){
      try{
        var u = location.href.split("#")[0].split("?")[0];
        location.replace(u + "?t=" + Date.now());
      }catch(e){ location.reload(); }
    }, MINUTES*60*1000);
  }
})();
</script>
<script>
//---------------------------------------------------------------------

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

(function(){
  "use strict";
  var D = TICKET_DATA, M = TICKET_META;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtNum(n){ return (Number(n)||0).toLocaleString("ja-JP",{minimumFractionDigits:0,maximumFractionDigits:2}); }

  var state = { q:"", filtered:[], curIndex:-1 };

  var autoNote = (location.protocol==="http:"||location.protocol==="https:") ? " ／ 自動更新中（約10分ごと）" : "";
  $("dataMeta").textContent = "最終更新 " + (M.generatedAt||"") + " ／ 糸順号 " + (M.count||D.length) + "件" + autoNote;

  // 検索（糸順号・品質・色番のAND検索）
  function filterTickets(){
    var terms = state.q.trim().toLowerCase().split(/[\s\u3000]+/).filter(Boolean);
    return D.filter(function(t){
      if(!terms.length) return true;
      var hay = (t.itoJungo+" "+t.oyaJungo+" "+t.itoQuality+" "+t.itoColor).toLowerCase();
      for(var i=0;i<terms.length;i++){ if(hay.indexOf(terms[i])<0) return false; }
      return true;
    });
  }

  function renderList(){
    state.filtered = filterTickets();
    var rows = state.filtered;
    $("listCount").textContent = rows.length + " 件";
    // 検索語が無いときは件数が多すぎるので先頭300件に制限（スクロール負荷対策）
    var show = state.q.trim() ? rows : rows.slice(0, 300);
    var html = show.map(function(t, i){
      var idx = D.indexOf(t);
      return '<div class="jcard'+(t.hasRecipe?"":" norecipe")+'" data-idx="'+idx+'">'
        + '<div class="jno">'+esc(t.itoJungo)+'</div>'
        + '<div class="jqc">'+esc(t.itoQuality)+' / '+esc(t.itoColor)+'</div>'
        + '<div class="jsub">トップ量 '+fmtNum(t.topQty)+'kg'
        +   (t.hasRecipe ? ' ／ 構成'+t.details.length+'件' : ' ／ レシピ無')+'</div>'
        + '</div>';
    }).join("");
    $("jlist").innerHTML = html || '<p class="list-empty">該当なし</p>';
    if(!state.q.trim() && rows.length>show.length){
      $("listCount").textContent = rows.length + " 件（先頭 "+show.length+" 件を表示。検索で絞り込めます）";
    }
  }

  // QR用テキスト（色トップ在庫と同構成: 染順号 ラベル   置場(3桁右空白) 数量×10）
  function qrTextOf(s){
    var dye=(s.dyeNo!=null)?String(s.dyeNo).trim():"";
    var label=(s.label!=null&&String(s.label).trim()!=="")?String(s.label).trim():"";
    var place=(s.place!=null)?String(s.place).trim():"";
    while(place.length<3){ place+=" "; }
    var q=Number(s.qty); if(!isFinite(q)) q=0;
    return dye+" "+label+"   "+place+" "+Math.round(q*10);
  }

  // 払出票1枚を描画
  function renderTicket(idx){
    var t = D[idx]; if(!t) return;
    state.curIndex = idx;

    // ヘッダー（PDF原本の払出票レイアウトを踏襲）
    var head =
      '<div class="t-sheet">'
      + '<div class="t-top">'
      +   '<table class="t-daihyo"><tr><td class="lab">台　号</td><td class="lab">氏　名</td></tr>'
      +     '<tr><td class="blank"></td><td class="blank"></td></tr></table>'
      +   '<div class="t-title">混毛払出票</div>'
      +   '<div class="t-date">'+esc(M.generatedAt||"")+' 時点</div>'
      + '</div>'
      + '<table class="t-head2">'
      +   '<tr><td class="k">糸順号</td><td class="v" colspan="5">'+esc(t.itoJungo)+'</td></tr>'
      +   '<tr>'
      +     '<td class="k">糸品質</td><td class="v">'+esc(t.itoQuality)+'</td>'
      +     '<td class="k">糸色番</td><td class="v">'+esc(t.itoColor)+'</td>'
      +     '<td class="k">トップ量</td><td class="v">'+fmtNum(t.topQty)+' kg</td>'
      +   '</tr>'
      + '</table>';

    // 明細
    var body;
    if(!t.hasRecipe || !t.details.length){
      body = '<div style="padding:18px;color:#b26a00;">この糸順号に対応する混毛レシピが見つかりませんでした。'
           + '（品質 '+esc(t.itoQuality)+' / 色番 '+esc(t.itoColor)+' / 番手 '+esc(t.bante)+'）</div>'
           + '</div>'; // t-sheet 閉じ
    } else {
      // --- テーブル（PC/印刷。PDF原本どおり8列格子）---
      // 品質・色番・必要量は各構成の先頭行だけ記入し、2行目以降は空セル（PDFと同じ）。
      // 在庫量0もそのまま表示（色付けしない）。構成に在庫候補が無い場合は1行だけ出す。
      var trs = "";
      t.details.forEach(function(d){
        var stocks = d.stocks || [];
        var rows = stocks.length ? stocks : [null];
        rows.forEach(function(s, si){
          var head3 = (si===0)
            ? '<td>'+esc(d.quality)+'</td><td>'+esc(d.color)+'</td><td>'+fmtNum(d.need)+'</td>'
            : '<td></td><td></td><td></td>';
          var rest = s
            ? '<td>'+esc(s.place||"")+'</td>'
              + '<td class="wrap">'+esc(s.dyeNo||"")+'</td>'
              + '<td>'+esc(s.label||"")+'</td>'
              + '<td>'+fmtNum(s.qty)+'</td>'
            : '<td></td><td class="wrap"></td><td></td><td></td>';
          trs += '<tr>'+head3+rest+'<td class="wrap"></td></tr>';
        });
      });
      // 末尾に空行を1行（PDFと同じ）
      trs += '<tr>'+'<td></td>'.repeat(8)+'</tr>';
      var table =
        '<div class="detail-table-wrap"><table class="det">'
        + '<colgroup>'
        +   '<col class="c-hinshitsu"><col class="c-iro"><col class="c-hitsuyo">'
        +   '<col class="c-basho"><col class="c-some"><col class="c-label">'
        +   '<col class="c-zaiko"><col class="c-tekisho">'
        + '</colgroup>'
        + '<thead><tr>'
        + '<th>品質</th><th>色番</th><th>必要量</th><th>場所</th><th>染順号</th>'
        + '<th>ラベル</th><th>在庫量</th><th>染順号（手記入）</th>'
        + '</tr></thead><tbody>'+trs+'</tbody></table></div>'
        + '</div>'; // t-sheet 閉じ

      // スマホもPCも同じ原本テーブルに統一（カードは廃止）
      body = table;
    }

    $("ticket").innerHTML = head + body;

    // ページャ（検索結果内での前後移動）
    var fi = state.filtered.indexOf(t);
    $("pagerText").textContent = (fi>=0) ? (fi+1)+" / "+state.filtered.length : "";
    switchView("ticket");
    window.scrollTo(0,0);
  }

  function switchView(v){
    $("view-search").style.display = v==="search" ? "block" : "none";
    $("view-ticket").style.display = v==="ticket" ? "block" : "none";
  }

  // イベント
  $("q").addEventListener("input", function(e){ state.q=e.target.value; renderList(); });
  $("clearBtn").addEventListener("click", function(){ state.q=""; $("q").value=""; renderList(); });
  $("jlist").addEventListener("click", function(e){
    var card=e.target.closest(".jcard");
    if(card&&card.dataset.idx) renderTicket(Number(card.dataset.idx));
  });
  $("backBtn").addEventListener("click", function(){ switchView("search"); });
  $("prevBtn").addEventListener("click", function(){
    var fi=state.filtered.indexOf(D[state.curIndex]);
    if(fi>0) renderTicket(D.indexOf(state.filtered[fi-1]));
  });
  $("nextBtn").addEventListener("click", function(){
    var fi=state.filtered.indexOf(D[state.curIndex]);
    if(fi>=0 && fi<state.filtered.length-1) renderTicket(D.indexOf(state.filtered[fi+1]));
  });

  // 元データ欄（生成側が window.__SOURCES に入れた内容を表示するだけ）
  function renderSources(){
    var foot = $("srcFoot"), S = window.__SOURCES;

    // 定期を先、単発を後（同じ種類の中は元の順）。cycle が無い古いデータは最後・空欄表示
    var rank = function(s){ return s.cycle==="定期" ? 0 : (s.cycle==="単発" ? 1 : 2); };
    var list = S.map(function(s,i){ return {s:s,i:i}; }).sort(function(a,b){
      return (rank(a.s)-rank(b.s)) || (a.i-b.i);
    }).map(function(x){ return x.s; });
    var nR = 0, nS = 0, nBad = 0;
    list.forEach(function(s){
      if(s.cycle==="定期") nR++; else if(s.cycle==="単発") nS++;
      if(!s.ok) nBad++;
    });
    var rows = list.map(function(s){
      var bad = s.ok ? "" : " bad";
      var cy = s.cycle==="定期" ? '<span class="cy cy-r">定期</span>'
             : (s.cycle==="単発" ? '<span class="cy cy-s">単発</span>' : '');
      return '<tr><td>'+esc(s.name)+'</td><td>'+cy+'</td><td>'+esc(s.when||"")+'</td><td>'+esc(s.from)+'</td>'
        + '<td>'+esc(s.updated||"-")+'</td>'
        + '<td class="num">'+(s.rows==null?"-":fmtNum(s.rows))+'</td>'
        + '<td class="'+bad.trim()+'">'+esc(s.status)+'</td></tr>';
    }).join("");
    var sum = '<summary>元データ（この画面が使っているデータ）'
      + '<span class="sum-info">全'+list.length+'件（定期 '+nR+'件 ／ 単発 '+nS+'件）</span>'
      + (nBad ? '<span class="sum-warn">要確認 '+nBad+'件</span>' : '')
      + '</summary>';
    foot.innerHTML = '<details>'+sum+'<div class="src-wrap"><table><thead><tr>'
      + '<th>元データ（ファイル名）</th><th>更新</th><th>更新のタイミング</th><th>取得先</th><th>ファイルの更新日時</th><th>件数</th><th>状態</th>'
      + '</tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '<div class="src-note">最終更新（配信）日時：'+esc(M.generatedAt||"-")
      + '<br>更新のタイミング：毎日 6:05〜22:55 の約10分ごとに自動で更新</div></details>';
    foot.style.display = "block";
  }
  try{ renderSources(); }catch(e){}

  renderList();
})();
</script>
</body>
</html>
